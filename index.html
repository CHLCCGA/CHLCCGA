<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>华沙新闻摘要</title>
<link rel="stylesheet" href="assets/site.css">
<style>
  .weekend.card { background: var(--accent-soft); box-shadow: none; }
  .when { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .product { color: var(--text-2); font-weight: 400; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">CHLCCGA</span>
    <nav class="tabs">
      <a href="brief/">全球速览</a>
      <a href="./" class="on">华沙摘要</a>
    </nav>
    <span class="spacer"></span>
    <div class="seg" id="lang">
      <button data-lang="zh">中文</button>
      <button data-lang="orig">原文</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <p class="eyebrow">华沙 · 波兰 · 欧洲 · 每周一、三、五更新</p>
    <h1><span class="grad">华沙摘要</span></h1>
    <p class="sub" id="meta">加载中…</p>
    <div class="issue-nav" id="nav"></div>
    <div id="errors"></div>
  </div>
  <div id="content"></div>
  <details class="status" id="status" hidden></details>
  <footer class="site">
    由云端 routine 自动生成 · <a id="json-link" href="news/data/">JSON</a> · <a href="https://github.com/CHLCCGA/CHLCCGA">GitHub</a>
  </footer>
</main>

<script>
const CATEGORIES = [
  ["warsaw_now", "华沙动态"],
  ["poland_brief", "波兰时政"],
  ["europe_brief", "欧洲要闻"],
  ["cool_finds", "展览与发现"],
  ["new_spots", "新店"],
  ["upcoming_events", "近期活动"],
];
const WEEKDAYS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

let LANG = "zh";
try { LANG = localStorage.getItem("brief-lang") === "orig" ? "orig" : "zh"; } catch (e) {}
let STATE = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function link(href, cls, text) {
  const a = el(/^https?:\/\//.test(href || "") ? "a" : "span", cls, text);
  if (a.tagName === "A") { a.href = href; a.target = "_blank"; a.rel = "noopener"; }
  return a;
}
function parseDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
}
function zhDate(s, withWeekday) {
  const d = parseDate(s);
  if (!d) return s || "";
  const t = `${d.getUTCMonth() + 1}月${d.getUTCDate()}日`;
  return withWeekday ? `${t} ${WEEKDAYS[d.getUTCDay()]}` : t;
}
function shortDate(s) {
  const d = parseDate(s);
  return d ? `${d.getUTCMonth() + 1}/${d.getUTCDate()}` : (s || "");
}
function minusDays(s, n) {
  const d = parseDate(s);
  if (!d) return "";
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0, 10);
}
const title = it => (LANG === "orig" && it.title_original) || it.title_zh || it.title_original || "";

function item(it, showWhen) {
  const li = el("li");
  const b = el("div", "body");
  const t = link(it.source_url, "t", null);
  t.style.fontWeight = "600";
  if (showWhen && it.event_date) t.append(el("span", "when", zhDate(it.event_date, true)));
  t.append(title(it));
  if (!showWhen && it.category === "cool_finds" && it.event_date) t.append(el("span", "product", ` · ${zhDate(it.event_date)}起`));
  b.append(t);
  if (it.summary_zh) b.append(el("div", "summary", it.summary_zh));
  const bits = [it.source_name];
  if (it.venue && it.venue !== it.source_name) bits.push(it.venue);
  if (!showWhen && it.published_date) bits.push(shortDate(it.published_date));
  b.append(el("div", "meta", bits.filter(Boolean).join(" · ")));
  li.append(b);
  return li;
}
function card(name, list, showWhen, cls) {
  const c = el("article", "card" + (cls ? " " + cls : ""));
  const head = el("div", "card-head");
  head.append(el("h3", null, name));
  c.append(head);
  if (!list.length) { c.append(el("p", "empty", "本期无")); return c; }
  const ol = el("ol", "items");
  list.forEach(it => ol.append(item(it, showWhen)));
  c.append(ol);
  return c;
}

function render() {
  const { date, dates, items, sources } = STATE;
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
  const d = parseDate(date);
  document.getElementById("meta").textContent =
    `${d.getUTCFullYear()}年${zhDate(date, true)} · 覆盖 ${shortDate(minusDays(date, 3))} — ${shortDate(date)} · 本期 ${items.length} 条`;
  document.getElementById("json-link").href = `news/data/${date}.json`;
  document.title = `华沙新闻摘要 · ${date}`;

  const nav = document.getElementById("nav");
  nav.replaceChildren();
  const i = dates.indexOf(date);
  const older = dates[i + 1], newer = dates[i - 1];
  const step = (x, text) => Object.assign(el("a", "pill-btn" + (x ? "" : " off"), text), x ? { href: `?d=${x}` } : {});
  const sel = el("select");
  for (const x of dates) sel.append(Object.assign(el("option", null, x), { value: x, selected: x === date }));
  sel.onchange = () => { location.search = `?d=${sel.value}`; };
  nav.append(step(older, "‹ 上一期"), sel, step(newer, "下一期 ›"));

  const content = document.getElementById("content");
  content.replaceChildren();
  if (!items.length) content.append(el("p", "notice", "本期没有新条目（可能是去重后为空，或抓取失败，见下方数据源状态）。"));

  const weekend = items.filter(it => (it.tags || []).includes("weekend"));
  if (weekend.length) {
    const sec = el("section", "group");
    sec.append(el("h2", null, "本周末"));
    const grid = el("div", "grid");
    grid.append(card("周末活动清单", weekend, true, "weekend full"));
    sec.append(grid);
    content.append(sec);
  }

  const sec = el("section", "group");
  sec.append(el("h2", null, "本期内容"));
  const grid = el("div", "grid");
  const none = [];
  for (const [key, zh] of CATEGORIES) {
    let list = items.filter(it => it.category === key && !weekend.includes(it));
    if (!list.length) { none.push(zh); continue; }
    if (key === "upcoming_events") list = list.slice().sort((a, b) => (a.event_date || "").localeCompare(b.event_date || ""));
    grid.append(card(zh, list, key === "upcoming_events"));
  }
  sec.append(grid);
  if (none.length) sec.append(el("p", "empty", `本期无：${none.join("、")}`));
  content.append(sec);

  const errors = document.getElementById("errors");
  errors.replaceChildren();
  const st = document.getElementById("status");
  st.replaceChildren();
  st.hidden = !(sources && sources.length);
  if (sources && sources.length) {
    // GATE / RERUN entries are run errors appended by the routine, not sites.
    const runErrors = sources.filter(s => s.name === "GATE" || s.name === "RERUN");
    const sites = sources.filter(s => !runErrors.includes(s));
    for (const s of runErrors) errors.append(el("div", "notice bad", `运行出错：${s.note}`));
    const failed = sites.filter(s => s.status === "fail").length;
    const warned = sites.filter(s => s.status === "warn").length;
    st.append(el("summary", null, `本期数据源：${sites.length} 个，失败 ${failed} 个，提示 ${warned} 个`));
    const ul = el("ul");
    for (const s of sites) ul.append(el("li", s.status, s.name + (s.note ? ` — ${s.note}` : "")));
    st.append(ul);
  }
}

document.querySelectorAll("#lang button").forEach(b => b.onclick = () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem("brief-lang", LANG); } catch (e) {}
  if (STATE) render();
});

(async function main() {
  try {
    const dates = await fetch("news/data/index.json", { cache: "no-cache" }).then(r => r.json());
    const q = new URLSearchParams(location.search).get("d");
    const date = dates.includes(q) ? q : dates[0];
    const items = await fetch(`news/data/${date}.json`, { cache: "no-cache" }).then(r => r.json());
    let sources = null;
    const r = await fetch(`news/data/${date}.sources.json`, { cache: "no-cache" });
    if (r.ok) sources = await r.json();
    STATE = { date, dates, items, sources };
    render();
  } catch (e) {
    document.getElementById("meta").replaceChildren(el("span", "error", "加载失败：" + e.message));
  }
})();
</script>
</body>
</html>
