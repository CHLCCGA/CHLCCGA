<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>速览</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">CHLCCGA</span>
    <nav class="secnav" id="secnav"></nav>
    <div class="seg" id="lang">
      <button data-lang="zh">中文</button>
      <button data-lang="orig">Original</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <div>
      <p class="eyebrow">世界 · 华沙 · 每周更新三次</p>
      <h1><span class="grad">速览</span></h1>
      <p class="sub" id="sub">加载中…</p>
    </div>
    <div class="issue-nav" id="issue-nav"></div>
  </div>
  <div id="notices"></div>
  <div id="content"></div>
  <details class="status" id="status" hidden></details>
  <footer class="site">
    世界部分每周一 08:17、周三 20:17、周六 08:17（华沙冬令时，夏令时晚 1 小时）由 GitHub Actions 抓取、DeepSeek 翻译；
    华沙部分每周一、三、五由 Claude routine 整理。<br>
    数据来自 upstract.com、alltop.com、tophub.today、pepper.pl、mydealz.de、bankier.pl 及华沙各信息源，版权归原站。
    JSON：<a id="json-brief" href="brief/data/">世界</a> · <a id="json-warsaw" href="news/data/">华沙</a> · <a href="https://github.com/CHLCCGA/CHLCCGA">GitHub</a>
  </footer>
</main>

<script>
// World part schedule (UTC) — keep in sync with .github/workflows/brief.yml.
const SLOTS = [[1, 7, 17], [3, 19, 17], [6, 7, 17]];   // [weekday, hour, minute]
const TAG_ZH = {
  "Story of the Day": "今日头条", "Tech": "科技", "Business": "商业", "Politics": "政治", "World": "世界",
  "Science": "科学", "Climate & Weather": "气候与天气", "Health": "健康", "Entertainment": "娱乐",
  "Sports": "体育", "Culture": "文化", "Finance": "金融", "Crypto": "加密货币", "AI": "人工智能",
};
// Warsaw digest categories, in reading order. They flow through one wide card in balanced
// columns, because how many items each category has changes from issue to issue.
const W_CATS = [
  ["warsaw_now", "华沙动态"], ["new_spots", "新店"], ["cool_finds", "展览与发现"],
  ["upcoming_events", "近期活动"], ["poland_brief", "波兰时政"], ["europe_brief", "欧洲要闻"],
];
const WD = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

let LANG = "zh";
try { LANG = localStorage.getItem("brief-lang") === "orig" ? "orig" : "zh"; } catch (e) {}
let S = null;   // { date, dates, brief, w: { date, items, sources } }

// ---------- helpers ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function link(href, cls, text) {
  const a = el(/^https?:\/\//.test(href || "") ? "a" : "span", cls, text);
  if (a.tagName === "A") { a.href = href; a.target = "_blank"; a.rel = "noopener"; }
  return a;
}
const zh = (item, key) => (LANG === "zh" && item[key + "_zh"]) || item[key];
const tagText = t => (LANG === "zh" && TAG_ZH[t]) || t;
const warsaw = (d, opts) => new Intl.DateTimeFormat("zh-CN", { timeZone: "Europe/Warsaw", ...opts }).format(d);
function parseDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
}
function dateText(s, weekday = true) {
  const d = parseDate(s);
  if (!d) return s || "";
  const t = `${d.getUTCMonth() + 1}月${d.getUTCDate()}日`;
  return weekday ? `${t} ${WD[d.getUTCDay()]}` : t;
}
function shortDate(s) {
  const d = parseDate(s);
  return d ? `${d.getUTCMonth() + 1}/${d.getUTCDate()}` : (s || "");
}
function minusDays(s, n) {
  const d = parseDate(s);
  if (!d) return "";
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0, 10);
}
function ago(iso) {
  const t = Date.parse(iso);
  if (!t) return "";
  const min = Math.max(1, Math.round((Date.now() - t) / 60000));
  if (min < 60) return `${min} 分钟前`;
  if (min < 48 * 60) return `${Math.round(min / 60)} 小时前`;
  return `${Math.round(min / 1440)} 天前`;
}
function nextRun(now) {
  for (let add = 0; add < 8; add++) {
    for (const [wd, h, m] of SLOTS) {
      const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + add, h, m));
      if (d.getUTCDay() === wd && d > now) return d;
    }
  }
  return null;
}
function money(v, cur) {
  if (v == null) return "";
  const loc = cur === "PLN" ? "pl-PL" : "de-DE";
  return new Intl.NumberFormat(loc, { style: "currency", currency: cur, maximumFractionDigits: Number.isInteger(v) ? 0 : 2 }).format(v);
}
function favicon(home) {
  try {
    const img = el("img");
    img.src = `https://www.google.com/s2/favicons?domain=${new URL(home).hostname}&sz=64`;
    img.alt = ""; img.loading = "lazy";
    img.onerror = () => img.remove();
    return img;
  } catch (e) { return null; }
}
function meta(parts) {
  const m = el("div", "meta");
  parts.filter(Boolean).forEach((p, i) => m.append(i ? el("span", "dot", p) : el("span", null, p)));
  return m;
}
function cardShell(name, home, cls) {
  const card = el("article", "card" + (cls ? " " + cls : ""));
  const head = el("div", "card-head");
  if (home) { const f = favicon(home); if (f) head.append(f); }
  head.append(el("h3", null, name));
  if (home) head.append(link(home, "home", "访问 ↗"));
  card.append(head);
  return card;
}

// ---------- world blocks ----------
function renderList(items, ol) {
  items.forEach((it, i) => {
    const li = el("li");
    li.append(el("span", "rank", i + 1));
    const b = el("div", "body");
    b.append(link(it.url, "t", zh(it, "title")));
    const parts = [
      it.source,
      it.traffic && `${it.traffic} 次搜索`,
      it.count && `${it.count} 个来源`,
      it.time && ago(it.time),
      it.gated && "经 upstract",
    ];
    if (parts.some(Boolean)) b.append(meta(parts));
    li.append(b);
    ol.append(li);
  });
}
function renderThreads(items, ol) {
  ol.classList.add("threads");
  items.forEach((it, i) => {
    const li = el("li", i === 0 && it.tag === "Story of the Day" ? "lead" : null);
    const b = el("div", "body");
    const top = el("div", "meta");
    if (it.tag) top.append(el("span", "tag", tagText(it.tag)), " ");
    if (it.count) top.append(`${it.count} ${it.tag === "Story of the Day" ? "个来源" : "篇报道"}`);
    if (it.source) top.append(` · ${it.source}`);
    b.append(top, link(it.url, "t", zh(it, "title")));
    if (it.summary) b.append(el("div", "summary", zh(it, "summary")));
    li.append(b);
    ol.append(li);
  });
}
function renderDeals(items, ol) {
  items.forEach(it => {
    const li = el("li", it.expired ? "expired" : null);
    li.append(el("span", "temp", `${it.temperature}°`));
    const b = el("div", "body");
    b.append(link(it.url, "t", zh(it, "title")));
    const m = el("div", "meta");
    if (it.price != null) {
      m.append(el("span", "price", money(it.price, it.currency)));
      if (it.price_old) {
        m.append(" ", el("span", "price-old", money(it.price_old, it.currency)));
        m.append(` −${Math.round((1 - it.price / it.price_old) * 100)}%`);
      }
    }
    const rest = [it.merchant, it.comments ? `${it.comments} 条评论` : null, it.expired ? "已过期" : null].filter(Boolean);
    if (rest.length) m.append((it.price != null ? " · " : "") + rest.join(" · "));
    b.append(m);
    li.append(b);
    ol.append(li);
  });
}
function renderOtd(items, ol) {
  items.forEach(it => {
    const li = el("li");
    li.append(el("span", "year", it.year));
    const b = el("div", "body");
    b.append(link(it.url, "t", zh(it, "title")));
    li.append(b);
    ol.append(li);
  });
}
function renderChanges(ch) {
  const box = el("div", "changes");
  if (!ch || !ch.prev) { box.append("首次记录，从下一期起会在这里显示与上一期相比的变化。"); return box; }
  const lines = [];
  for (const x of ch.added || []) lines.push(`新上榜：${x.title}（第 ${x.rank} 名）`);
  for (const x of ch.removed || []) lines.push(`下榜：${x.title}（原第 ${x.rank} 名）`);
  for (const x of ch.moved || []) lines.push(`名次变化：${x.title} 第 ${x.from} → 第 ${x.to} 名`);
  for (const x of ch.bonus || []) lines.push(`奖励变化：${x.title} ${x.from == null ? "无" : money(x.from, "PLN")} → ${x.to == null ? "无" : money(x.to, "PLN")}`);
  const head = el("b", null, `与 ${dateText(ch.prev, false)} 那一期相比`);
  if (!lines.length) { box.append(head, "：没有变化。"); return box; }
  box.append(head, `：${lines.length} 处变化`);
  const ul = el("ul");
  lines.forEach(l => ul.append(el("li", null, l)));
  box.append(ul);
  return box;
}
function renderBank(block, card, ol) {
  card.insertBefore(renderChanges(block.changes), ol);
  ol.classList.add("bank");
  block.items.forEach(it => {
    const li = el("li");
    li.append(el("span", "rank", it.rank));
    const b = el("div", "body");
    const name = link(it.url, "t", null);
    name.append(el("span", "who", it.bank || it.title));
    if (it.product) name.append(el("span", "dim", ` · ${it.product}`));
    b.append(name);
    const tags = el("div", "meta");
    if (it.promoted) tags.append(el("span", "tag gray", "推广位"), " ");
    if (it.label && !it.promoted) tags.append(el("span", "tag", LANG === "zh" && /Zwycięzca/.test(it.label) ? "年度最佳账户" : it.label), " ");
    if (it.account_fee) tags.append(`账户费 ${it.account_fee}`);
    if (tags.childNodes.length) b.append(tags);
    const bonusText = LANG === "zh" ? (it.bonus_zh || it.bonus_text) : it.bonus_text;
    if (bonusText) b.append(el("div", "summary", bonusText));
    li.append(b);
    const bonus = el("div", "bonus", it.bonus_max != null ? money(it.bonus_max, "PLN") : "—");
    bonus.append(el("small", null, "最高奖励"));
    li.append(bonus);
    ol.append(li);
  });
}
function renderBlock(block, limit, cls) {
  const card = cardShell(block.name, block.home, cls);
  card.id = `b-${block.id}`;
  if (block.status !== "ok") {
    card.append(el("p", "fail", `本期未抓到：${block.error || "未知错误"}`));
    return card;
  }
  const items = limit ? block.items.slice(0, limit) : block.items;
  if (block.kind === "trends") {
    const box = el("div", "trend-chips");
    items.forEach((it, i) => {
      const a = link(it.url, null, null);
      a.append(el("b", null, i + 1), zh(it, "title"));
      box.append(a);
    });
    card.append(box);
    return card;
  }
  const ol = el("ol", "items");
  card.append(ol);
  if (block.kind === "bank") renderBank(block, card, ol);
  else ({ threads: renderThreads, deals: renderDeals, otd: renderOtd }[block.kind] || renderList)(items, ol);
  return card;
}

// Columns follow the card count so every row is full: 4 → 4, 3/6 → 3, 2 → 2, 1 → 1.
function colsFor(n) { return n % 4 === 0 ? 4 : n % 3 === 0 ? 3 : n <= 2 ? n : 3; }

function section(id, label, note) {
  const sec = el("section", "group");
  sec.id = id;
  const h = el("h2", null, label);
  if (note) h.append(el("small", null, note));
  sec.append(h);
  document.getElementById("secnav").append(Object.assign(el("a", null, label), { href: `#${id}` }));
  return sec;
}
function renderGroup(g, blocks) {
  const sec = section(`g-${g.id}`, g.label);
  if (g.layout === "lead") {
    const grid = el("div", "grid c3 lead");
    grid.append(renderBlock(blocks[0], null, "span2"));
    const stack = el("div", "stack");
    blocks.slice(1).forEach(b => stack.append(renderBlock(b)));
    grid.append(stack);
    sec.append(grid);
    return sec;
  }
  const grid = el("div", `grid c${colsFor(blocks.length)}`);
  // Same number of rows in every headline list of a section, so the cards line up.
  const lists = blocks.filter(b => b.status === "ok" && b.kind === "list");
  const limit = lists.length > 1 ? Math.max(5, Math.min(...lists.map(b => b.items.length))) : null;
  blocks.forEach(b => grid.append(renderBlock(b, b.kind === "list" ? limit : null)));
  sec.append(grid);
  return sec;
}

// ---------- Warsaw digest ----------
const wTitle = it => (LANG === "orig" && it.title_original) || it.title_zh || it.title_original || "";
function wItem(it, showWhen, heading) {
  const li = el("div", "w-item" + (heading ? " first" : ""));
  if (heading) li.append(el("p", "sub-h", heading));
  const b = el("div", "body");
  const t = link(it.source_url, "t strong", null);
  if (showWhen && it.event_date) t.append(el("span", "when", dateText(it.event_date)));
  t.append(wTitle(it));
  if (!showWhen && it.category === "cool_finds" && it.event_date) t.append(el("span", "dim", ` · ${dateText(it.event_date, false)}起`));
  b.append(t);
  if (it.summary_zh) b.append(el("div", "summary", it.summary_zh));
  const bits = [it.source_name];
  if (it.venue && it.venue !== it.source_name) bits.push(it.venue);
  if (!showWhen && it.published_date) bits.push(shortDate(it.published_date));
  b.append(el("div", "meta", bits.filter(Boolean).join(" · ")));
  li.append(b);
  return li;
}
function renderWarsaw(w) {
  const sec = section("g-warsaw", "华沙 · 波兰 · 欧洲",
    `${dateText(w.date)} · 覆盖 ${shortDate(minusDays(w.date, 3))}–${shortDate(w.date)} · ${w.items.length} 条`);
  const card = el("article", "card");
  const flow = el("div", "flow");
  const weekend = w.items.filter(it => (it.tags || []).includes("weekend"));
  weekend.forEach((it, i) => flow.append(wItem(it, true, i === 0 ? "★ 本周末" : null)));
  const none = [];
  for (const [cat, label] of W_CATS) {
    let list = w.items.filter(it => it.category === cat && !weekend.includes(it));
    if (!list.length) { none.push(label); continue; }
    if (cat === "upcoming_events") list = list.slice().sort((a, b) => (a.event_date || "").localeCompare(b.event_date || ""));
    list.forEach((it, i) => flow.append(wItem(it, cat === "upcoming_events", i === 0 ? label : null)));
  }
  card.append(flow);
  if (none.length) card.append(el("p", "empty", `本期无：${none.join("、")}`));
  sec.append(card);
  return sec;
}

// ---------- page ----------
function render() {
  const { date, dates, brief, w } = S;
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
  document.title = `速览 · ${date}`;

  const latest = dates.indexOf(date) === 0;
  const next = nextRun(new Date());
  const bits = [];
  if (brief) bits.push(`世界 ${dateText(brief.date)} ${warsaw(new Date(brief.generated_at), { hour: "2-digit", minute: "2-digit" })} 更新`);
  if (w) bits.push(`华沙 ${dateText(w.date)}`);
  if (latest && next) bits.push(`下一期约 ${warsaw(next, { month: "long", day: "numeric" })} ${warsaw(next, { weekday: "short" })} ${warsaw(next, { hour: "2-digit", minute: "2-digit" })}`);
  document.getElementById("sub").textContent = bits.join(" · ");

  const nav = document.getElementById("issue-nav");
  nav.replaceChildren();
  const i = dates.indexOf(date);
  const older = dates[i + 1], newer = dates[i - 1];
  const step = (d, text) => Object.assign(el("a", "pill-btn" + (d ? "" : " off"), text), d ? { href: `?d=${d}` } : {});
  const sel = el("select");
  dates.forEach(d => sel.append(Object.assign(el("option", null, dateText(d)), { value: d, selected: d === date })));
  sel.onchange = () => { location.search = `?d=${sel.value}`; };
  nav.append(step(older, "‹ 上一期"), sel, step(newer, "下一期 ›"));

  const notices = document.getElementById("notices");
  notices.replaceChildren();
  const tr = (brief && brief.translation) || {};
  if (LANG === "zh" && tr.missing) {
    notices.append(el("div", "notice", `本期有 ${tr.missing} 条还没有中文译文，先显示原文${tr.error ? `（${tr.error}）` : ""}。`));
  }
  const runErrors = ((w && w.sources) || []).filter(s => s.name === "GATE" || s.name === "RERUN");
  runErrors.forEach(s => notices.append(el("div", "notice bad", `华沙摘要运行出错：${s.note}`)));

  document.getElementById("secnav").replaceChildren();
  const content = document.getElementById("content");
  content.replaceChildren();
  const groups = brief ? brief.groups.filter(g => brief.blocks.some(b => b.group === g.id)) : [];
  groups.forEach((g, k) => {
    content.append(renderGroup(g, brief.blocks.filter(b => b.group === g.id)));
    if (k === 0 && w) content.append(renderWarsaw(w));
  });
  if (!groups.length && w) content.append(renderWarsaw(w));

  document.getElementById("json-brief").href = brief ? `brief/data/${brief.date}.json` : "brief/data/";
  document.getElementById("json-warsaw").href = w ? `news/data/${w.date}.json` : "news/data/";

  const st = document.getElementById("status");
  st.replaceChildren();
  st.hidden = false;
  const sum = [];
  if (brief) {
    const failed = brief.blocks.filter(b => b.status !== "ok").length;
    sum.push(`世界 ${brief.blocks.length} 块，失败 ${failed}`);
    if (tr.done != null) sum.push(`已翻译 ${tr.done} 条${tr.missing ? `，未翻译 ${tr.missing} 条` : ""}`);
  }
  const sites = ((w && w.sources) || []).filter(s => !runErrors.includes(s));
  if (sites.length) sum.push(`华沙 ${sites.length} 个源，失败 ${sites.filter(s => s.status === "fail").length}，提示 ${sites.filter(s => s.status === "warn").length}`);
  st.append(el("summary", null, `数据源：${sum.join(" · ")}`));
  if (brief) {
    st.append(el("h4", null, "世界"));
    const ul = el("ul");
    brief.blocks.forEach(b => ul.append(el("li", b.status === "ok" ? "ok" : "fail", `${b.name}：${b.status === "ok" ? `${b.items.length} 条` : b.error}`)));
    if (tr.error) ul.append(el("li", "warn", `翻译：${tr.error}`));
    st.append(ul);
  }
  if (sites.length) {
    st.append(el("h4", null, "华沙"));
    const ul = el("ul");
    sites.forEach(s => ul.append(el("li", s.status, s.name + (s.note ? ` — ${s.note}` : ""))));
    st.append(ul);
  }
}

document.querySelectorAll("#lang button").forEach(b => b.onclick = () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem("brief-lang", LANG); } catch (e) {}
  if (S) render();
});

const getJSON = url => fetch(url, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r.json(); });

(async function main() {
  try {
    const [bDates, wDates] = await Promise.all([
      getJSON("brief/data/index.json").catch(() => []),
      getJSON("news/data/index.json").catch(() => []),
    ]);
    const dates = [...new Set([...bDates, ...wDates])].sort().reverse();
    const q = new URLSearchParams(location.search).get("d");
    const date = dates.includes(q) ? q : dates[0];
    // Show, for the chosen day, the latest issue of each part up to that day.
    const bDate = bDates.find(d => d <= date), wDate = wDates.find(d => d <= date);
    const [brief, wItems, wSources] = await Promise.all([
      bDate ? getJSON(`brief/data/${bDate}.json`) : null,
      wDate ? getJSON(`news/data/${wDate}.json`) : null,
      wDate ? getJSON(`news/data/${wDate}.sources.json`).catch(() => null) : null,
    ]);
    S = { date, dates, brief, w: wDate ? { date: wDate, items: wItems, sources: wSources } : null };
    render();
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  } catch (e) {
    document.getElementById("sub").replaceChildren(el("span", "error", "加载失败：" + e.message));
  }
})();
</script>
</body>
</html>
