# What the home page (index.html) shows from the aggregators, in order. The page never changes:
# build.py turns this list into brief/data/<date>.json and the page renders whatever is there.
# The Warsaw digest (news/data/, written by the Claude routine) is inserted after the first group,
# followed by the groups marked `local: true` (Warsaw what's-on) and then the exchange rates.
#
# - groups: the page sections (order + title; note = small text after the title). layout: lead = first card two columns wide, the
#   other cards stacked in the third column. Otherwise the page picks 4/3/2 columns from the card count,
#   so keep each group at 2, 3, 4 or 6 cards to fill whole rows.
# - blocks: one card each. To add another upstract box, copy an upstract line and set `section`
#   to the box's heading on upstract.com; other sites need a parser function in parsers.py.
#   kind = list | threads | trends | deals | bank | otd | events decides how the card is drawn.
# - kind: events (Warsaw venues' own program pages): a parser returns single performances or runs
#   (festivals); build.py keeps the next `days` days (default 14), merges repeat performances of a title
#   and keeps the first `limit` titles (default 10). A url with {y} {m} {mm} {last} placeholders is fetched
#   for this month and the next; a list of urls is fetched as it is and read by the one parser.
#   Nothing on in the window is not an error: the card is hidden (status idle).
#   seasonal: true = an empty program is normal too (a festival outside its dates).
#   lang: the source language; non-zh blocks get Chinese translations (the page can switch back to the original).
#   translate: headline = translate event titles as plain text (they are not names of works, e.g. addresses).
# - quiet: true (kind: list): an empty result is normal, the card is hidden (status idle). The parser's items from
#   all urls are merged (one per link, soonest `at` first, `limit`). names: url part → source name shown on each item.
# Schedule: .github/workflows/brief.yml (and SLOTS in index.html for the "next issue" hint).
groups:
  - {id: focus, label: 今日焦点, layout: lead}
  - {id: film, label: 电影, local: true, note: "华沙 · 未来两周"}
  - {id: stage, label: 舞台, local: true, note: "华沙 · 未来两周"}
  - {id: music, label: 音乐, local: true, note: "华沙 · 未来两周"}
  - {id: fest, label: 节庆与市集, local: true, note: "华沙 · 未来一个月；酒类节庆看五个月"}
  - {id: protest, label: 集会与抗议, local: true, note: "教育与科研界 · 只列还没举行的；没有就不显示"}
  - {id: news, label: 新闻}
  - {id: ideas, label: 深度与评论}
  - {id: alltop, label: Alltop 分类}
  - {id: social, label: 热议}
  - {id: deals, label: 折扣热榜}
  - {id: money, label: 开户奖励}

