  # Protests. Unions announce their Warsaw rallies 2-3 weeks ahead (Solidarność's 17 Oct 2026 rally: 28 Sep);
  # Solidarność's national site posts too much for its plain feed, so its keyword searches are read instead.
  # 3procentnanauke.pl (the researchers' "3% for science" campaign) has no posts, only a landing page.
  - id: edu_protest
    name: "教育与科研界 · 抗议公告"
    group: protest
    kind: list
    parser: protest_feed
    quiet: true
    url:
      - "https://www.solidarnosc.org.pl/ksn/feed/"
      - "https://www.solidarnosc.org.pl/?s=manifestac&feed=rss2"
      - "https://www.solidarnosc.org.pl/?s=protest&feed=rss2"
